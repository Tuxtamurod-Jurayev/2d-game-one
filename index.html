<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Runner — Subway Heroes Multi-Stage Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b1338 0%, #0c0a18 100%);
      color: #fff;
      font-family: 'Consolas', 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    h1 {
      color: #00f0ff;
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
      transition: color 0.4s ease;
    }
    .tag {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    canvas {
      background: #140d28;
      border: 2px solid rgba(0, 240, 255, 0.6);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 240, 255, 0.25);
      max-width: 95vw;
      max-height: 75vh;
    }
    .footer {
      margin-top: 14px;
      color: #a59bc3;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="titleText">Pixel Runner</h1>
    <span class="tag" id="stageTag">Stage 1: Cyber Dawn</span>
    <span class="tag" id="heroTag" style="border-color:#ff4b6e;color:#ff4b6e;">Hero: JAKE</span>
  </div>
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <div class="footer">Q / E: Change Hero | SPACE: Jump (2x Double Jump) | DOWN: Slide | ESC: Pause</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const GROUND_Y = 430;
    const GRAVITY = 0.85;
    const JUMP_FORCE = -14.2;
    const DOUBLE_JUMP_FORCE = -16.2;

    // 4 Subway Heroes from Image 1
    const HEROES = [
      {
        id: "jake",
        name: "JAKE",
        title: "SUBWAY CAPTAIN",
        accent: "#00f0ff",
        vest: "#376eb9",
        hoodie: "#e6e6eb",
        pants: "#26375f",
        skin: "#f4caa8"
      },
      {
        id: "tricky",
        name: "TRICKY",
        title: "ACROBAT SKATER",
        accent: "#ff3c50",
        beanie: "#eb2832",
        blonde: "#fcde62",
        jeans: "#4682c8",
        skin: "#fad7be"
      },
      {
        id: "fresh",
        name: "FRESH",
        title: "RHYTHM MASTER",
        accent: "#32e150",
        tank: "#2dd74b",
        shorts: "#eb2d37",
        skin: "#a56941"
      },
      {
        id: "yutani",
        name: "YUTANI",
        title: "TECH ALIEN",
        accent: "#78e628",
        onesie: "#7dd737",
        purple: "#b93cfa",
        skin: "#f5cdb4"
      }
    ];

    let selectedHeroIdx = 0;

    // Multi-Stage Configuration
    const STAGES = [
      {
        id: 1,
        name: "CYBER DAWN",
        thresh: 0,
        nextThresh: 1200,
        accent: "#00f0ff",
        secondary: "#00ffb4",
        skyTop: "#0a081a",
        skyBottom: "#1a1034",
        ground: "#141020",
        groundLine: "#00f0ff",
        grid: "#322055",
        moonCol: "#dcf5ff",
        windows: ["#00f0ff", "#b4e6ff", "#fff096"]
      },
      {
        id: 2,
        name: "SUNSET METROPOLIS",
        thresh: 1200,
        nextThresh: 3000,
        accent: "#ffbe28",
        secondary: "#ff6432",
        skyTop: "#1c0c22",
        skyBottom: "#461c32",
        ground: "#22121e",
        groundLine: "#ffb414",
        grid: "#55233c",
        moonCol: "#ffd28c",
        windows: ["#ffd250", "#ff8c3c", "#ffeb96"]
      },
      {
        id: 3,
        name: "NEON NIGHTFALL",
        thresh: 3000,
        nextThresh: 5500,
        accent: "#ff2da0",
        secondary: "#be3cff",
        skyTop: "#120822",
        skyBottom: "#320e40",
        ground: "#1a0c24",
        groundLine: "#ff32a0",
        grid: "#5a1955",
        moonCol: "#ffbef0",
        windows: ["#ff50b4", "#be50ff", "#ffdcfa"]
      },
      {
        id: 4,
        name: "APEX OVERDRIVE",
        thresh: 5500,
        nextThresh: 999999,
        accent: "#00ff8c",
        secondary: "#f0fffa",
        skyTop: "#061016",
        skyBottom: "#102a30",
        ground: "#0c181c",
        groundLine: "#00ffa0",
        grid: "#124b46",
        moonCol: "#c8ffe8",
        windows: ["#00ffa0", "#dcfff0", "#00d2ff"]
      }
    ];

    let currentStageIdx = 0;
    let stageProgress = 0.0;
    let bannerTimer = 0;

    let state = "MENU";
    let speed = 7.0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem("pixel_runner_hi") || "0", 10);
    let coins = 0;
    let screenShake = 0;

    const player = {
      x: 140,
      y: GROUND_Y,
      vy: 0,
      w: 32,
      h: 58,
      wDuck: 56,
      hDuck: 28,
      isGrounded: true,
      isDucking: false,
      jumpCount: 0,
      isDoubleJumping: false,
      flipAngle: 0,
      tick: 0,
      particles: []
    };

    let obstacles = [];
    let coinList = [];
    let coinSparkles = [];
    let spawnTimer = 0;
    let groundOffset = 0;

    function generateSkyline(count, minH, maxH, hasWindows, hasBillboards) {
      const buildings = [];
      let curX = 0;
      const bTexts = ["SUBWAY", "RUN", "NEON", "CYBER"];
      for (let i = 0; i < count; i++) {
        const w = 48 + Math.floor(Math.random() * 40);
        const h = minH + Math.floor(Math.random() * (maxH - minH));
        const windows = [];
        let billboard = null;
        if (hasWindows) {
          for (let ry = 16; ry < h - 24; ry += 24) {
            for (let rx = 8; rx < w - 12; rx += 16) {
              if (Math.random() < 0.65) {
                windows.push({ rx, ry, variant: Math.floor(Math.random() * 3) });
              }
            }
          }
        }
        if (hasBillboards && Math.random() < 0.25 && w >= 55) {
          billboard = { text: bTexts[i % bTexts.length], w: w - 12, h: 18 };
        }
        buildings.push({ x: curX, w, h, windows, billboard });
        curX += w + 8 + Math.floor(Math.random() * 16);
      }
      return buildings;
    }

    const buildingsBack = generateSkyline(28, 70, 170, false, false);
    const buildingsFront = generateSkyline(24, 110, 240, true, true);
    let backScroll = 0;
    let frontScroll = 0;

    const clouds = [
      { x: 120, y: 40, w: 140, speed: 0.18 },
      { x: 450, y: 70, w: 160, speed: 0.22 },
      { x: 780, y: 35, w: 120, speed: 0.15 }
    ];

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function initAudio() {
      if (!actx) actx = new AudioCtx();
    }
    function playBeep(freq, type, duration, endFreq) {
      if (!actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, actx.currentTime + duration);
        gain.gain.setValueAtTime(0.2, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + duration);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch (e) {}
    }

    function switchHero(delta) {
      selectedHeroIdx = (selectedHeroIdx + delta + HEROES.length) % HEROES.length;
      const h = HEROES[selectedHeroIdx];
      document.getElementById("heroTag").textContent = `Hero: ${h.name}`;
      document.getElementById("heroTag").style.borderColor = h.accent;
      document.getElementById("heroTag").style.color = h.accent;
      playBeep(980, "sine", 0.1, 1200);
    }

    function resetGame() {
      player.y = GROUND_Y;
      player.vy = 0;
      player.isGrounded = true;
      player.isDucking = false;
      player.jumpCount = 0;
      player.isDoubleJumping = false;
      player.flipAngle = 0;
      player.particles = [];
      obstacles = [];
      coinList = [];
      coinSparkles = [];
      speed = 7.0;
      score = 0;
      coins = 0;
      spawnTimer = 0;
      currentStageIdx = 0;
      stageProgress = 0.0;
      bannerTimer = 0;
      state = "PLAYING";
    }

    const keys = {};
    window.addEventListener("keydown", (e) => {
      initAudio();
      keys[e.code] = true;

      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        if (state === "MENU" || state === "GAMEOVER") {
          resetGame();
        } else if (state === "PLAYING" && !player.isDucking) {
          if (player.isGrounded) {
            player.vy = JUMP_FORCE;
            player.isGrounded = false;
            player.jumpCount = 1;
            player.isDoubleJumping = false;
            playBeep(320, "square", 0.15, 750);
          } else if (player.jumpCount < 2) {
            player.vy = DOUBLE_JUMP_FORCE;
            player.jumpCount = 2;
            player.isDoubleJumping = true;
            player.flipAngle = 0;
            playBeep(450, "sine", 0.22, 1100);
            player.particles.push({
              x: player.x,
              y: player.y - 6,
              vx: 0,
              vy: 0,
              isRing: true,
              size: 8,
              color: HEROES[selectedHeroIdx].accent,
              life: 20
            });
          }
        }
      } else if (e.code === "KeyQ" || e.code === "ArrowLeft") {
        if (state === "MENU") switchHero(-1);
      } else if (e.code === "KeyE" || e.code === "ArrowRight") {
        if (state === "MENU") switchHero(1);
      } else if (e.code === "Escape") {
        if (state === "PLAYING") state = "PAUSED";
        else if (state === "PAUSED") state = "PLAYING";
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        if (!player.isGrounded && player.vy < -4.5) {
          player.vy *= 0.55;
        }
      }
    });

    canvas.addEventListener("click", (e) => {
      initAudio();
      if (state === "MENU") {
        const rect = canvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
        // Left arrow click
        if (cx >= 240 && cx <= 280 && cy >= 190 && cy <= 240) {
          switchHero(-1);
        } else if (cx >= 680 && cx <= 720 && cy >= 190 && cy <= 240) {
          switchHero(1);
        } else if (cy >= 280) {
          resetGame();
        }
      }
    });

    function update() {
      if (state !== "PLAYING") return;

      player.isDucking = (keys["ArrowDown"] || keys["KeyS"]) && player.isGrounded;
      if (!player.isGrounded && (keys["ArrowDown"] || keys["KeyS"])) {
        player.vy += GRAVITY * 1.6;
      }

      player.vy += GRAVITY;
      player.y += player.vy;

      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
        player.isDoubleJumping = false;
        player.flipAngle = 0;
      }

      if (player.isDoubleJumping && !player.isGrounded) {
        player.flipAngle += 22;
        if (player.flipAngle >= 360) {
          player.flipAngle = 0;
          player.isDoubleJumping = false;
        }
      }

      if (speed < 16.5) speed += 0.0016;
      score += speed * 0.1;
      if (score > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem("pixel_runner_hi", highScore);
      }

      let newStageIdx = 0;
      for (let i = 0; i < STAGES.length; i++) {
        if (score >= STAGES[i].thresh) newStageIdx = i;
      }
      const stg = STAGES[newStageIdx];
      if (stg.nextThresh >= 999999) stageProgress = 1.0;
      else stageProgress = (score - stg.thresh) / (stg.nextThresh - stg.thresh);

      if (newStageIdx > currentStageIdx) {
        currentStageIdx = newStageIdx;
        bannerTimer = 170;
        speed = Math.min(16.5, speed + 0.6);
        document.getElementById("stageTag").textContent = `Stage ${stg.id}: ${stg.name}`;
        document.getElementById("stageTag").style.borderColor = stg.accent;
        document.getElementById("stageTag").style.color = stg.accent;
        document.getElementById("titleText").style.color = stg.accent;
      }
      if (bannerTimer > 0) bannerTimer--;

      groundOffset = (groundOffset + speed) % 40;
      backScroll = (backScroll + speed * 0.15) % (canvas.width * 2);
      frontScroll = (frontScroll + speed * 0.38) % (canvas.width * 2);
      player.tick += 0.26 * (speed / 7.0);

      clouds.forEach(c => {
        c.x -= c.speed * (speed / 7.0 + 0.3);
        if (c.x + c.w < -50) c.x = canvas.width + 50;
      });

      // Particles
      if (player.isGrounded) {
        if (player.isDucking) {
          if (Math.random() < 0.6) {
            player.particles.push({
              x: player.x - 10 + Math.random() * 10,
              y: player.y - 2,
              vx: -(Math.random() * 3 + 1),
              vy: -(Math.random() * 1.5),
              color: HEROES[selectedHeroIdx].accent,
              size: Math.random() * 3 + 2,
              life: 14
            });
          }
        } else if (Math.floor(player.tick * 2) % 4 === 0) {
          player.particles.push({
            x: player.x - 12,
            y: player.y - 2,
            vx: -(Math.random() * 2 + 1),
            vy: -0.5,
            color: "#8c82a5",
            size: Math.random() * 3 + 2,
            life: 12
          });
        }
      }

      player.particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.isRing) p.size += 1.4;
        else p.size *= 0.92;
        p.life--;
      });
      player.particles = player.particles.filter(p => p.life > 0 && p.size > 0.5);

      // Spawning
      spawnTimer++;
      const minInterval = Math.max(45, 105 - (speed - 7) * 5.2);
      if (spawnTimer >= minInterval) {
        spawnTimer = 0;
        if (Math.random() < 0.75) {
          const isDrone = speed > 8.0 && Math.random() < 0.40;
          obstacles.push({
            x: canvas.width + 40,
            y: isDrone ? GROUND_Y - 40 : GROUND_Y,
            w: isDrone ? 42 : (Math.random() < 0.5 ? 26 : 48),
            h: isDrone ? 24 : 46,
            isDrone: isDrone
          });
        } else {
          const coinY = GROUND_Y - (Math.random() < 0.55 ? 35 : 95);
          for (let i = 0; i < 3; i++) {
            coinList.push({
              x: canvas.width + 40 + i * 36,
              y: coinY,
              r: 11
            });
          }
        }
      }

      const curW = player.isDucking ? player.wDuck : player.w;
      const curH = player.isDucking ? player.hDuck : player.h;
      const px = player.x - (player.isDucking ? 24 : 14);
      const py = player.y - curH + 4;

      for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        o.x -= speed;
        const ox = o.x;
        const oy = o.y - o.h;
        if (px + curW > ox + 4 && px < ox + o.w - 4 && py + curH > oy + 4 && py < oy + o.h) {
          playBeep(140, "sawtooth", 0.3, 40);
          screenShake = 16;
          state = "GAMEOVER";
          break;
        }
      }
      obstacles = obstacles.filter(o => o.x + o.w > -50);

      for (let i = 0; i < coinList.length; i++) {
        const c = coinList[i];
        c.x -= speed;
        if (px + curW > c.x - c.r && px < c.x + c.r && py + curH > c.y - c.r && py < c.y + c.r) {
          coins++;
          score += 100;
          playBeep(980, "sine", 0.15, 1318);
          for (let s = 0; s < 6; s++) {
            coinSparkles.push({
              x: c.x, y: c.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              color: "#ffea50",
              size: Math.random() * 3 + 2,
              life: 16
            });
          }
          coinList.splice(i, 1);
          i--;
        }
      }
      coinList = coinList.filter(c => c.x > -50);

      coinSparkles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.size *= 0.92;
        p.life--;
      });
      coinSparkles = coinSparkles.filter(p => p.life > 0 && p.size > 0.5);

      if (screenShake > 0) screenShake--;
    }

    function drawGlassPill(x, y, w, h, borderColor) {
      ctx.fillStyle = "rgba(18, 14, 34, 0.85)";
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, h / 2);
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function drawHero(heroIdx, customX, customY) {
      const hero = HEROES[heroIdx];
      const hipX = customX !== undefined ? customX : player.x;
      const curY = customY !== undefined ? customY : player.y;
      const cycle = player.tick;

      // Ground Shadow
      const alt = Math.max(0, GROUND_Y - curY);
      const shScale = Math.max(0.2, 1.0 - alt / 260.0);
      ctx.fillStyle = `rgba(0, 0, 0, ${0.45 * shScale})`;
      ctx.beginPath();
      ctx.ellipse(hipX, GROUND_Y, 24 * shScale, 6 * shScale, 0, 0, Math.PI * 2);
      ctx.fill();

      if (customX === undefined && player.isDucking) {
        // Slide pose
        const slideY = curY - 10;
        ctx.fillStyle = hero.accent;
        ctx.beginPath();
        ctx.roundRect(hipX - 18, slideY - 14, 22, 14, 4);
        ctx.fill();
        ctx.fillStyle = hero.skin;
        ctx.beginPath();
        ctx.arc(hipX - 22, slideY - 14, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#222636";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(hipX + 2, slideY - 4);
        ctx.lineTo(hipX + 28, slideY - 1);
        ctx.stroke();
        return;
      }

      if (customX === undefined && player.isDoubleJumping) {
        ctx.save();
        ctx.translate(hipX, curY - 28);
        ctx.rotate((-player.flipAngle * Math.PI) / 180);
        ctx.fillStyle = hero.accent;
        ctx.beginPath();
        ctx.roundRect(-8, -10, 16, 18, 4);
        ctx.fill();
        ctx.fillStyle = hero.skin;
        ctx.beginPath();
        ctx.arc(4, -18, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      const isAir = customX === undefined && !player.isGrounded;
      const bob = isAir ? 0 : Math.sin(cycle * 2.0) * 2.5;
      const hipY = curY - 28 + bob;
      const leg1Angle = isAir ? 0.6 : Math.sin(cycle) * 0.75;
      const leg2Angle = isAir ? -0.5 : Math.sin(cycle + Math.PI) * 0.75;

      // Legs
      function drawSimpleLeg(angle, color) {
        const thigh = 14, shin = 14;
        const kneeBend = angle > 0 ? Math.sin(angle) * 0.4 : -Math.sin(angle) * 0.8;
        const kx = hipX + Math.sin(angle) * thigh;
        const ky = hipY + Math.cos(angle) * thigh;
        const fx = kx + Math.sin(angle - kneeBend * 0.5) * shin;
        const fy = Math.min(ky + Math.cos(angle - kneeBend * 0.5) * shin, GROUND_Y);

        ctx.strokeStyle = color;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(kx, ky);
        ctx.lineTo(fx, fy);
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.fillRect(fx - 3, fy - 6, 10, 6);
      }

      const pantsColor = hero.id === "tricky" ? "#4682c8" : (hero.id === "fresh" ? "#eb2d37" : (hero.id === "yutani" ? "#7dd737" : "#26375f"));
      drawSimpleLeg(leg2Angle, pantsColor);

      // Torso
      ctx.fillStyle = hero.id === "tricky" ? "#fff" : (hero.id === "fresh" ? "#2dd74b" : (hero.id === "yutani" ? "#7dd737" : "#376eb9"));
      ctx.beginPath();
      ctx.roundRect(hipX - 8, hipY - 20, 16, 20, 4);
      ctx.fill();

      // Head
      const headX = hipX + 4;
      const headY = hipY - 30;
      ctx.fillStyle = hero.skin;
      ctx.beginPath();
      ctx.arc(headX, headY, 9, 0, Math.PI * 2);
      ctx.fill();

      // Character-specific Head Accessories
      if (hero.id === "jake") {
        // Jake White/Red Cap
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(headX, headY - 3, 9, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = "#eb2d37";
        ctx.fillRect(headX - 11, headY - 6, 8, 4); // Back visor
      } else if (hero.id === "tricky") {
        // Red Beanie & Blonde Pigtails
        ctx.fillStyle = "#eb2832";
        ctx.beginPath();
        ctx.ellipse(headX, headY - 5, 9, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fcde62";
        ctx.beginPath();
        ctx.arc(headX - 9, headY - 2, 5, 0, Math.PI * 2);
        ctx.arc(headX + 5, headY + 2, 4, 0, Math.PI * 2);
        ctx.fill();
      } else if (hero.id === "fresh") {
        // High-Top Fade Hair
        ctx.fillStyle = "#161010";
        ctx.fillRect(headX - 7, headY - 22, 14, 15);
      } else if (hero.id === "yutani") {
        // Alien Monster Onesie Hood & Giant Eyes
        ctx.fillStyle = "#7dd737";
        ctx.beginPath();
        ctx.arc(headX, headY, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f5cdb4";
        ctx.beginPath();
        ctx.arc(headX + 2, headY + 1, 7, 0, Math.PI * 2);
        ctx.fill();
        // Big cartoon eyes on hood
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(headX - 4, headY - 10, 5, 0, Math.PI * 2);
        ctx.arc(headX + 5, headY - 10, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#1a1a24";
        ctx.beginPath();
        ctx.arc(headX - 4, headY - 10, 2.5, 0, Math.PI * 2);
        ctx.arc(headX + 5, headY - 10, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      drawSimpleLeg(leg1Angle, pantsColor);

      // Arm
      ctx.strokeStyle = hero.accent;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(hipX + 2, hipY - 14);
      ctx.lineTo(hipX + 2 + Math.sin(-leg2Angle * 0.8) * 11, hipY - 4);
      ctx.stroke();
    }

    function draw() {
      const stage = STAGES[currentStageIdx];
      const hero = HEROES[selectedHeroIdx];

      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, stage.skyTop);
      skyGrad.addColorStop(1, stage.skyBottom);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Celestial Moon
      const moonX = canvas.width - 180, moonY = 100;
      ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
      ctx.beginPath();
      ctx.arc(moonX, moonY, 56, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = stage.moonCol;
      ctx.beginPath();
      ctx.arc(moonX, moonY, 32, 0, Math.PI * 2);
      ctx.fill();

      // Stars
      ctx.fillStyle = "#fff";
      for (let i = 0; i < 40; i++) {
        const sx = (i * 47) % canvas.width;
        const sy = (i * 29) % (GROUND_Y - 90);
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Clouds
      clouds.forEach(c => {
        ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.w / 2, 14, 0, 0, Math.PI * 2);
        ctx.fill();
      });

      // Distant Skyline
      ctx.fillStyle = stage.skyBottom;
      buildingsBack.forEach(b => {
        const bx = (b.x - backScroll * 1.5) % (canvas.width * 2) - 100;
        if (bx >= -100 && bx <= canvas.width + 100) {
          ctx.fillRect(bx, GROUND_Y - b.h, b.w, b.h);
        }
      });

      // Front Skyline with Windows & Billboards
      buildingsFront.forEach(b => {
        const bx = (b.x - frontScroll * 1.5) % (canvas.width * 2) - 100;
        if (bx >= -100 && bx <= canvas.width + 100) {
          const bTop = GROUND_Y - b.h;
          ctx.fillStyle = "#221c32";
          ctx.fillRect(bx, bTop, b.w, b.h);

          if (b.billboard) {
            ctx.fillStyle = "#100c1e";
            ctx.fillRect(bx + 6, bTop + 8, b.billboard.w, b.billboard.h);
            ctx.strokeStyle = stage.groundLine;
            ctx.strokeRect(bx + 6, bTop + 8, b.billboard.w, b.billboard.h);
            ctx.fillStyle = stage.groundLine;
            ctx.font = "bold 11px Consolas";
            ctx.fillText(b.billboard.text, bx + 10, bTop + 21);
          }

          b.windows.forEach(w => {
            if (!b.billboard || w.ry >= 32) {
              ctx.fillStyle = stage.windows[w.variant % stage.windows.length];
              ctx.fillRect(bx + w.rx, bTop + w.ry, 8, 12);
            }
          });
        }
      });

      // Ground
      ctx.fillStyle = stage.ground;
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      // Rails & Ties
      ctx.strokeStyle = "#8c96b4";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y - 2);
      ctx.lineTo(canvas.width, GROUND_Y - 2);
      ctx.stroke();

      ctx.strokeStyle = stage.groundLine;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      for (let x = -40; x < canvas.width + 40; x += 36) {
        const rx = x - groundOffset;
        ctx.strokeStyle = "#3c324b";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(rx, GROUND_Y);
        ctx.lineTo(rx - 4, GROUND_Y + 12);
        ctx.stroke();
      }

      ctx.strokeStyle = stage.grid;
      ctx.lineWidth = 2;
      for (let x = -40; x < canvas.width + 40; x += 40) {
        const gx = x - groundOffset;
        ctx.beginPath();
        ctx.moveTo(gx, GROUND_Y + 12);
        ctx.lineTo(gx - 32, canvas.height);
        ctx.stroke();
      }

      // Particles
      player.particles.forEach(p => {
        if (p.isRing) {
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.size * 2, p.size * 0.8, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      coinSparkles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      coinList.forEach(c => {
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(c.x, c.y + Math.sin(player.tick * 0.2) * 4, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#b98c00";
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      obstacles.forEach(o => {
        if (o.isDrone) {
          ctx.fillStyle = "#ffb400";
          ctx.beginPath();
          ctx.roundRect(o.x, o.y - o.h, o.w, o.h, 6);
          ctx.fill();
        } else {
          ctx.fillStyle = "#ff2d6e";
          ctx.beginPath();
          ctx.roundRect(o.x, o.y - o.h, o.w, o.h, 4);
          ctx.fill();
        }
      });

      // Draw Selected Hero
      drawHero(selectedHeroIdx);

      // HUD
      drawGlassPill(20, 18, 140, 36, stage.secondary);
      ctx.fillStyle = stage.secondary;
      ctx.font = "bold 13px Consolas";
      ctx.fillText("SCORE", 35, 41);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 16px Consolas";
      ctx.fillText(String(Math.floor(score)).padStart(6, '0'), 80, 41);

      // Hero Pill
      drawGlassPill(170, 18, 100, 36, hero.accent);
      ctx.fillStyle = hero.accent;
      ctx.font = "bold 14px Consolas";
      ctx.fillText(hero.name, 195, 41);

      // Stage Pill
      drawGlassPill(280, 18, 150, 36, stage.accent);
      ctx.fillStyle = stage.accent;
      ctx.font = "bold 12px Consolas";
      ctx.fillText(`STAGE ${stage.id}`, 294, 32);
      ctx.fillStyle = "#221c32";
      ctx.beginPath();
      ctx.roundRect(294, 38, 122, 6, 3);
      ctx.fill();
      ctx.fillStyle = stage.accent;
      ctx.beginPath();
      ctx.roundRect(294, 38, Math.max(4, 122 * stageProgress), 6, 3);
      ctx.fill();

      // Coins Pill
      drawGlassPill(canvas.width / 2 + 30, 18, 105, 36, "#ffd700");
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 16px Consolas";
      ctx.fillText(`x ${coins}`, canvas.width / 2 + 65, 41);

      // Best
      drawGlassPill(canvas.width - 255, 18, 140, 36, "#ffb432");
      ctx.fillStyle = "#ffb432";
      ctx.font = "bold 13px Consolas";
      ctx.fillText("BEST", canvas.width - 243, 41);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 15px Consolas";
      ctx.fillText(String(Math.floor(highScore)).padStart(6, '0'), canvas.width - 198, 41);

      // Speed
      drawGlassPill(canvas.width - 105, 18, 88, 36, stage.accent);
      ctx.fillStyle = stage.accent;
      ctx.font = "bold 14px Consolas";
      ctx.fillText(`${speed.toFixed(1)}x`, canvas.width - 75, 41);

      // Banner
      if (bannerTimer > 0) {
        ctx.fillStyle = "rgba(16, 12, 32, 0.92)";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 220, 85, 440, 64, 12);
        ctx.fill();
        ctx.strokeStyle = stage.accent;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = stage.accent;
        ctx.font = "bold 22px Consolas";
        ctx.textAlign = "center";
        ctx.fillText(`★ STAGE ${stage.id}: ${stage.name} ★`, canvas.width / 2, 112);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px Consolas";
        ctx.fillText("SPEED INCREASED • NEW CHALLENGES UNLOCKED", canvas.width / 2, 134);
        ctx.textAlign = "left";
      }

      // MENU WITH HERO SELECTION
      if (state === "MENU") {
        ctx.fillStyle = "rgba(10, 8, 22, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(18, 14, 34, 0.94)";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 290, canvas.height / 2 - 200, 580, 410, 16);
        ctx.fill();
        ctx.strokeStyle = "rgba(0, 240, 255, 0.6)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#00f0ff";
        ctx.font = "bold 36px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("PIXEL RUNNER", canvas.width / 2, canvas.height / 2 - 145);
        ctx.fillStyle = "#a59bc3";
        ctx.font = "bold 13px Consolas";
        ctx.fillText("SUBWAY HEROES EDITION • SELECT YOUR RUNNER", canvas.width / 2, canvas.height / 2 - 120);

        // Character Showcase Box
        ctx.fillStyle = "#18122a";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 240, canvas.height / 2 - 100, 480, 115, 12);
        ctx.fill();
        ctx.strokeStyle = hero.accent;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Left Arrow
        ctx.fillStyle = "#261c3e";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 225, canvas.height / 2 - 60, 34, 34, 8);
        ctx.fill();
        ctx.fillStyle = hero.accent;
        ctx.font = "bold 22px Consolas";
        ctx.fillText("<", canvas.width / 2 - 208, canvas.height / 2 - 36);

        // Right Arrow
        ctx.fillStyle = "#261c3e";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 + 191, canvas.height / 2 - 60, 34, 34, 8);
        ctx.fill();
        ctx.fillStyle = hero.accent;
        ctx.fillText(">", canvas.width / 2 + 208, canvas.height / 2 - 36);

        // Preview Model
        drawHero(selectedHeroIdx, canvas.width / 2 - 120, canvas.height / 2 + 2);

        // Hero Info
        ctx.textAlign = "left";
        ctx.fillStyle = hero.accent;
        ctx.font = "bold 22px Consolas";
        ctx.fillText(hero.name, canvas.width / 2 - 40, canvas.height / 2 - 65);

        ctx.fillStyle = "#ffbe28";
        ctx.font = "bold 12px Consolas";
        ctx.fillText(hero.title, canvas.width / 2 - 40, canvas.height / 2 - 42);

        ctx.fillStyle = "#a59bc3";
        ctx.font = "12px Consolas";
        ctx.fillText("Press [Q] or [E] to change hero", canvas.width / 2 - 40, canvas.height / 2 - 15);

        // Play Button
        ctx.fillStyle = "#00f0ff";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 150, canvas.height / 2 + 35, 300, 44, 22);
        ctx.fill();
        ctx.fillStyle = "#0c0a18";
        ctx.font = "bold 18px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("PRESS SPACE TO PLAY", canvas.width / 2, canvas.height / 2 + 63);

        ctx.fillStyle = "#fff";
        ctx.font = "13px Consolas";
        ctx.fillText("SPACE / W : Jump (2x for Double Jump!)", canvas.width / 2, canvas.height / 2 + 110);
        ctx.fillText("DOWN / S : Low Slide under drones", canvas.width / 2, canvas.height / 2 + 132);
        ctx.textAlign = "left";
      } else if (state === "PAUSED") {
        ctx.fillStyle = "rgba(8, 6, 18, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = hero.accent;
        ctx.font = "bold 36px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("GAME PAUSED", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#fff";
        ctx.font = "16px Consolas";
        ctx.fillText("Press ESC to Resume", canvas.width / 2, canvas.height / 2 + 25);
        ctx.textAlign = "left";
      } else if (state === "GAMEOVER") {
        ctx.fillStyle = "rgba(22, 6, 16, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(24, 10, 22, 0.95)";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 230, canvas.height / 2 - 160, 460, 330, 16);
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 75, 110, 0.7)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#ff4b6e";
        ctx.font = "bold 38px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 95);

        ctx.fillStyle = hero.accent;
        ctx.font = "bold 15px Consolas";
        ctx.fillText(`Runner: ${hero.name}`, canvas.width / 2, canvas.height / 2 - 62);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px Consolas";
        ctx.fillText(`Final Score: ${String(Math.floor(score)).padStart(6, '0')}`, canvas.width / 2, canvas.height / 2 - 32);

        ctx.fillStyle = "#ffd700";
        ctx.fillText(`Best Score: ${String(Math.floor(highScore)).padStart(6, '0')}`, canvas.width / 2, canvas.height / 2 + 2);

        ctx.fillStyle = "#00f0ff";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 160, canvas.height / 2 + 55, 320, 44, 22);
        ctx.fill();
        ctx.fillStyle = "#0c0a18";
        ctx.font = "bold 17px Consolas";
        ctx.fillText("PRESS SPACE TO RESTART", canvas.width / 2, canvas.height / 2 + 83);
        ctx.textAlign = "left";
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    function loop() {
      update();
      draw();
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
