<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Runner — Modern Human Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1b1338 0%, #0c0a18 100%);
      color: #fff;
      font-family: 'Consolas', 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    h1 {
      color: #00f0ff;
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }
    .tag {
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    canvas {
      background: #140d28;
      border: 2px solid rgba(0, 240, 255, 0.6);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 240, 255, 0.25);
      max-width: 95vw;
      max-height: 75vh;
    }
    .footer {
      margin-top: 14px;
      color: #a59bc3;
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pixel Runner</h1>
    <span class="tag">Humanoid Edition</span>
  </div>
  <canvas id="gameCanvas" width="960" height="540"></canvas>
  <div class="footer">SPACE / W: Jump | DOWN / S: Slide | ESC: Pause</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const GROUND_Y = 430;
    const GRAVITY = 0.85;
    const JUMP_FORCE = -15.5;

    let state = "MENU"; // MENU, PLAYING, PAUSED, GAMEOVER
    let speed = 7.0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem("pixel_runner_hi") || "0", 10);
    let coins = 0;
    let screenShake = 0;

    // Humanoid Player Object
    const player = {
      x: 140,
      y: GROUND_Y,
      vy: 0,
      w: 32,
      h: 58,
      wDuck: 56,
      hDuck: 28,
      isGrounded: true,
      isDucking: false,
      tick: 0,
      particles: []
    };

    let obstacles = [];
    let coinList = [];
    let coinSparkles = [];
    let spawnTimer = 0;
    let groundOffset = 0;

    // Audio Synthesis (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function initAudio() {
      if (!actx) actx = new AudioCtx();
    }
    function playBeep(freq, type, duration, endFreq) {
      if (!actx) return;
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, actx.currentTime + duration);
        gain.gain.setValueAtTime(0.2, actx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + duration);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + duration);
      } catch (e) {}
    }

    function resetGame() {
      player.y = GROUND_Y;
      player.vy = 0;
      player.isGrounded = true;
      player.isDucking = false;
      player.particles = [];
      obstacles = [];
      coinList = [];
      coinSparkles = [];
      speed = 7.0;
      score = 0;
      coins = 0;
      spawnTimer = 0;
      state = "PLAYING";
    }

    // Input handlers
    const keys = {};
    window.addEventListener("keydown", (e) => {
      initAudio();
      keys[e.code] = true;

      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
        if (state === "MENU" || state === "GAMEOVER") {
          resetGame();
        } else if (state === "PLAYING" && player.isGrounded && !player.isDucking) {
          player.vy = JUMP_FORCE;
          player.isGrounded = false;
          playBeep(320, "square", 0.15, 750);
        }
      } else if (e.code === "Escape") {
        if (state === "PLAYING") state = "PAUSED";
        else if (state === "PAUSED") state = "PLAYING";
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      initAudio();
      if (state === "MENU" || state === "GAMEOVER") {
        resetGame();
      } else if (state === "PLAYING" && player.isGrounded) {
        player.vy = JUMP_FORCE;
        player.isGrounded = false;
        playBeep(320, "square", 0.15, 750);
      }
    });

    function update() {
      if (state !== "PLAYING") return;

      player.isDucking = (keys["ArrowDown"] || keys["KeyS"]) && player.isGrounded;
      if (!player.isGrounded && (keys["ArrowDown"] || keys["KeyS"])) {
        player.vy += GRAVITY * 1.5;
      }

      player.vy += GRAVITY;
      player.y += player.vy;

      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.isGrounded = true;
      }

      if (speed < 16.5) speed += 0.0016;
      score += speed * 0.1;
      if (score > highScore) {
        highScore = Math.floor(score);
        localStorage.setItem("pixel_runner_hi", highScore);
      }

      groundOffset = (groundOffset + speed) % 40;
      player.tick += 0.28 * (speed / 7.0);

      // Footstep & Slide Particles
      if (player.isGrounded) {
        if (player.isDucking) {
          if (Math.random() < 0.6) {
            player.particles.push({
              x: player.x - 10 + Math.random() * 10,
              y: player.y - 2,
              vx: -(Math.random() * 3 + 1),
              vy: -(Math.random() * 1.5),
              color: Math.random() < 0.5 ? "#00f0ff" : "#ffb432",
              size: Math.random() * 3 + 2,
              life: 14
            });
          }
        } else if (Math.floor(player.tick * 2) % 4 === 0) {
          player.particles.push({
            x: player.x - 12,
            y: player.y - 2,
            vx: -(Math.random() * 2 + 1),
            vy: -0.5,
            color: "#8c82a5",
            size: Math.random() * 3 + 2,
            life: 12
          });
        }
      }

      player.particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.size *= 0.92;
        p.life--;
      });
      player.particles = player.particles.filter(p => p.life > 0 && p.size > 0.5);

      // Spawning
      spawnTimer++;
      const minInterval = Math.max(50, 105 - (speed - 7) * 5.2);
      if (spawnTimer >= minInterval) {
        spawnTimer = 0;
        if (Math.random() < 0.75) {
          const isDrone = speed > 8.2 && Math.random() < 0.38;
          obstacles.push({
            x: canvas.width + 40,
            y: isDrone ? GROUND_Y - 40 : GROUND_Y,
            w: isDrone ? 42 : (Math.random() < 0.5 ? 26 : 48),
            h: isDrone ? 24 : 46,
            isDrone: isDrone
          });
        } else {
          const coinY = GROUND_Y - (Math.random() < 0.55 ? 35 : 85);
          for (let i = 0; i < 3; i++) {
            coinList.push({
              x: canvas.width + 40 + i * 36,
              y: coinY,
              r: 11
            });
          }
        }
      }

      // Check obstacle collisions
      const curW = player.isDucking ? player.wDuck : player.w;
      const curH = player.isDucking ? player.hDuck : player.h;
      const px = player.x - (player.isDucking ? 24 : 14);
      const py = player.y - curH + 4;

      for (let i = 0; i < obstacles.length; i++) {
        const o = obstacles[i];
        o.x -= speed;
        const ox = o.x;
        const oy = o.y - o.h;
        if (px + curW > ox + 4 && px < ox + o.w - 4 && py + curH > oy + 4 && py < oy + o.h) {
          playBeep(140, "sawtooth", 0.3, 40);
          screenShake = 16;
          state = "GAMEOVER";
          break;
        }
      }
      obstacles = obstacles.filter(o => o.x + o.w > -50);

      // Coins & Sparkles
      for (let i = 0; i < coinList.length; i++) {
        const c = coinList[i];
        c.x -= speed;
        if (px + curW > c.x - c.r && px < c.x + c.r && py + curH > c.y - c.r && py < c.y + c.r) {
          coins++;
          score += 100;
          playBeep(980, "sine", 0.15, 1318);
          for (let s = 0; s < 6; s++) {
            coinSparkles.push({
              x: c.x, y: c.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              color: "#ffea50",
              size: Math.random() * 3 + 2,
              life: 16
            });
          }
          coinList.splice(i, 1);
          i--;
        }
      }
      coinList = coinList.filter(c => c.x > -50);

      coinSparkles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.size *= 0.92;
        p.life--;
      });
      coinSparkles = coinSparkles.filter(p => p.life > 0 && p.size > 0.5);

      if (screenShake > 0) screenShake--;
    }

    // Modern Glass Badge Helper
    function drawGlassPill(x, y, w, h, borderColor) {
      ctx.fillStyle = "rgba(18, 14, 34, 0.85)";
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, h / 2);
      ctx.fill();
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Draw Humanoid Runner
    function drawHumanoid() {
      const cycle = player.tick;
      const hipX = player.x;

      if (player.isDucking) {
        // SLIDING POSE
        const slideY = player.y - 10;
        // Torso
        ctx.fillStyle = "#00d2e6";
        ctx.beginPath();
        ctx.roundRect(hipX - 18, slideY - 14, 22, 14, 4);
        ctx.fill();
        // Head
        ctx.fillStyle = "#f2c3a0";
        ctx.beginPath();
        ctx.arc(hipX - 22, slideY - 14, 8, 0, Math.PI * 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = "#fff";
        ctx.fillRect(hipX - 20, slideY - 15, 3, 2);
        // Hair
        ctx.fillStyle = "#2a1c16";
        ctx.beginPath();
        ctx.moveTo(hipX - 29, slideY - 13);
        ctx.lineTo(hipX - 36, slideY - 21);
        ctx.lineTo(hipX - 20, slideY - 22);
        ctx.closePath();
        ctx.fill();
        // Extended leg
        ctx.strokeStyle = "#222636";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(hipX + 2, slideY - 4);
        ctx.lineTo(hipX + 28, slideY - 1);
        ctx.stroke();
        // Sneaker
        ctx.fillStyle = "#ff465f";
        ctx.fillRect(hipX + 24, slideY - 4, 12, 6);
        ctx.fillStyle = "#fff";
        ctx.fillRect(hipX + 24, slideY + 1, 12, 2);
        return;
      }

      if (!player.isGrounded) {
        // JUMPING POSE
        const hipY = player.y - 26;
        // Torso
        ctx.fillStyle = "#00d2e6";
        ctx.beginPath();
        ctx.roundRect(hipX - 8, hipY - 20, 16, 20, 4);
        ctx.fill();
        // Head
        ctx.fillStyle = "#f2c3a0";
        ctx.beginPath();
        ctx.arc(hipX + 2, hipY - 31, 9, 0, Math.PI * 2);
        ctx.fill();
        // Hair blown up
        ctx.fillStyle = "#2a1c16";
        ctx.beginPath();
        ctx.moveTo(hipX - 6, hipY - 29);
        ctx.lineTo(hipX - 10, hipY - 43);
        ctx.lineTo(hipX + 7, hipY - 42);
        ctx.closePath();
        ctx.fill();
        // Legs tucked
        ctx.strokeStyle = "#222636";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(hipX - 3, hipY);
        ctx.lineTo(hipX - 12, hipY + 12);
        ctx.moveTo(hipX + 3, hipY);
        ctx.lineTo(hipX + 10, hipY + 8);
        ctx.stroke();
        // Sneakers
        ctx.fillStyle = "#ff465f";
        ctx.fillRect(hipX - 16, hipY + 10, 8, 5);
        ctx.fillRect(hipX + 8, hipY + 6, 8, 5);
        return;
      }

      // RUNNING POSE
      const bob = Math.sin(cycle * 2.0) * 2.5;
      const hipY = player.y - 28 + bob;
      const leg1Angle = Math.sin(cycle) * 0.75;
      const leg2Angle = Math.sin(cycle + Math.PI) * 0.75;

      // Helper for leg
      function drawLeg(angle, isBack) {
        const thigh = 14, shin = 14;
        const kneeBend = angle > 0 ? Math.sin(angle) * 0.4 : -Math.sin(angle) * 0.8;
        const kx = hipX + Math.sin(angle) * thigh;
        const ky = hipY + Math.cos(angle) * thigh;
        const fx = kx + Math.sin(angle - kneeBend * 0.5) * shin;
        const fy = Math.min(ky + Math.cos(angle - kneeBend * 0.5) * shin, GROUND_Y);

        ctx.strokeStyle = isBack ? "#191c2a" : "#222636";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(kx, ky);
        ctx.lineTo(fx, fy);
        ctx.stroke();

        ctx.fillStyle = isBack ? "#c8324b" : "#ff465f";
        ctx.fillRect(fx - 3, fy - 6, 10, 6);
        ctx.fillStyle = "#fff";
        ctx.fillRect(fx - 3, fy - 2, 10, 2);
      }

      // Back leg
      drawLeg(leg2Angle, true);

      // Torso
      ctx.fillStyle = "#00d2e6";
      ctx.beginPath();
      ctx.roundRect(hipX - 7, hipY - 20, 16, 20, 4);
      ctx.fill();
      ctx.fillStyle = "#0096b4";
      ctx.fillRect(hipX, hipY - 17, 2, 17);

      // Head
      ctx.fillStyle = "#f2c3a0";
      ctx.beginPath();
      ctx.arc(hipX + 4, hipY - 31, 9, 0, Math.PI * 2);
      ctx.fill();
      // Eye
      ctx.fillStyle = "#fff";
      ctx.fillRect(hipX + 7, hipY - 33, 4, 3);
      ctx.fillStyle = "#141428";
      ctx.fillRect(hipX + 9, hipY - 33, 2, 3);
      // Hair
      ctx.fillStyle = "#2a1c16";
      ctx.beginPath();
      ctx.moveTo(hipX - 4, hipY - 30);
      ctx.lineTo(hipX - 8, hipY - 40);
      ctx.lineTo(hipX + 10, hipY - 41);
      ctx.lineTo(hipX + 12, hipY - 36);
      ctx.closePath();
      ctx.fill();

      // Front leg
      drawLeg(leg1Angle, false);

      // Front arm
      ctx.strokeStyle = "#00d2e6";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(hipX + 2, hipY - 14);
      ctx.lineTo(hipX + 2 + Math.sin(-leg2Angle * 0.8) * 11, hipY - 4);
      ctx.stroke();
    }

    function draw() {
      ctx.save();
      if (screenShake > 0) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      }

      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGrad.addColorStop(0, "#120a26");
      skyGrad.addColorStop(1, "#241640");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = "#181426";
      ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

      // Neon horizon line
      ctx.strokeStyle = "#00f0ff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      // Perspective grid stripes
      ctx.strokeStyle = "#37235a";
      ctx.lineWidth = 2;
      for (let x = -40; x < canvas.width + 40; x += 40) {
        const gx = x - groundOffset;
        ctx.beginPath();
        ctx.moveTo(gx, GROUND_Y);
        ctx.lineTo(gx - 30, canvas.height);
        ctx.stroke();
      }

      // Particles
      player.particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Sparkles
      coinSparkles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Coins
      coinList.forEach(c => {
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(c.x, c.y + Math.sin(player.tick * 0.2) * 4, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#b98c00";
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Obstacles
      obstacles.forEach(o => {
        if (o.isDrone) {
          ctx.fillStyle = "#ffb400";
          ctx.beginPath();
          ctx.roundRect(o.x, o.y - o.h, o.w, o.h, 6);
          ctx.fill();
          // Drone eye
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(o.x + o.w / 2, o.y - o.h / 2, 4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = "#ff2d6e";
          ctx.beginPath();
          ctx.roundRect(o.x, o.y - o.h, o.w, o.h, 4);
          ctx.fill();
          // Inner highlight
          ctx.fillStyle = "#ff78a0";
          ctx.fillRect(o.x + 4, o.y - o.h + 4, o.w - 8, o.h - 6);
        }
      });

      // Draw Humanoid Player
      drawHumanoid();

      // Modern Glass HUD Badges
      // 1. Score
      drawGlassPill(20, 18, 160, 36, "rgba(0, 255, 180, 0.4)");
      ctx.fillStyle = "#00ffb4";
      ctx.font = "bold 13px Consolas";
      ctx.fillText("SCORE", 35, 41);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 16px Consolas";
      ctx.fillText(String(Math.floor(score)).padStart(6, '0'), 85, 41);

      // 2. Coins
      drawGlassPill(canvas.width / 2 - 55, 18, 110, 36, "rgba(255, 215, 0, 0.4)");
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.arc(canvas.width / 2 - 35, 36, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 16px Consolas";
      ctx.fillText(`x ${coins}`, canvas.width / 2 - 18, 41);

      // 3. Hi-Score
      drawGlassPill(canvas.width - 275, 18, 150, 36, "rgba(255, 180, 50, 0.4)");
      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 13px Consolas";
      ctx.fillText("BEST", canvas.width - 262, 41);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 15px Consolas";
      ctx.fillText(String(Math.floor(highScore)).padStart(6, '0'), canvas.width - 215, 41);

      // 4. Speed
      drawGlassPill(canvas.width - 115, 18, 95, 36, "rgba(0, 240, 255, 0.4)");
      ctx.fillStyle = "#00f0ff";
      ctx.font = "bold 14px Consolas";
      ctx.fillText(`${speed.toFixed(1)}x`, canvas.width - 80, 41);

      // State Overlays
      if (state === "MENU") {
        ctx.fillStyle = "rgba(10, 8, 22, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "rgba(18, 14, 34, 0.9)";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 250, canvas.height / 2 - 170, 500, 340, 16);
        ctx.fill();
        ctx.strokeStyle = "rgba(0, 240, 255, 0.6)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#00f0ff";
        ctx.font = "bold 38px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("PIXEL RUNNER", canvas.width / 2, canvas.height / 2 - 90);
        ctx.fillStyle = "#a59bc3";
        ctx.font = "bold 14px Consolas";
        ctx.fillText("MODERN HUMAN EDITION", canvas.width / 2, canvas.height / 2 - 60);

        ctx.fillStyle = "#00f0ff";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 150, canvas.height / 2 - 25, 300, 46, 23);
        ctx.fill();
        ctx.fillStyle = "#0c0a18";
        ctx.font = "bold 18px Consolas";
        ctx.fillText("PRESS SPACE TO PLAY", canvas.width / 2, canvas.height / 2 + 4);

        ctx.fillStyle = "#fff";
        ctx.font = "14px Consolas";
        ctx.fillText("SPACE / W : Jump | DOWN / S : Slide", canvas.width / 2, canvas.height / 2 + 75);
        ctx.textAlign = "left";
      } else if (state === "PAUSED") {
        ctx.fillStyle = "rgba(8, 6, 18, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00f0ff";
        ctx.font = "bold 36px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("GAME PAUSED", canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = "#fff";
        ctx.font = "16px Consolas";
        ctx.fillText("Press ESC to Resume", canvas.width / 2, canvas.height / 2 + 25);
        ctx.textAlign = "left";
      } else if (state === "GAMEOVER") {
        ctx.fillStyle = "rgba(22, 6, 16, 0.88)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "rgba(24, 10, 22, 0.95)";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 230, canvas.height / 2 - 160, 460, 320, 16);
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 75, 110, 0.7)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = "#ff4b6e";
        ctx.font = "bold 38px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 95);

        ctx.fillStyle = "#fff";
        ctx.font = "bold 20px Consolas";
        ctx.fillText(`Final Score: ${String(Math.floor(score)).padStart(6, '0')}`, canvas.width / 2, canvas.height / 2 - 40);

        ctx.fillStyle = "#ffd700";
        ctx.fillText(`Best Score: ${String(Math.floor(highScore)).padStart(6, '0')}`, canvas.width / 2, canvas.height / 2 - 5);

        ctx.fillStyle = "#00f0ff";
        ctx.beginPath();
        ctx.roundRect(canvas.width / 2 - 160, canvas.height / 2 + 55, 320, 44, 22);
        ctx.fill();
        ctx.fillStyle = "#0c0a18";
        ctx.font = "bold 17px Consolas";
        ctx.fillText("PRESS SPACE TO RESTART", canvas.width / 2, canvas.height / 2 + 83);
        ctx.textAlign = "left";
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    function loop() {
      update();
      draw();
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
